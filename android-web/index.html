<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Kopi Sore POS</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f8f7f4; color: #29251f; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 520px); padding: 32px; border: 1px solid #e8e3da; border-radius: 20px; background: #fff; box-shadow: 0 12px 40px #29251f12; }
      h1 { margin: 0 0 12px; font-size: 1.5rem; }
      p { line-height: 1.6; color: #5f5a52; }
      code { padding: 2px 6px; border-radius: 6px; background: #f1eee8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Kopi Sore POS belum terhubung</h1>
      <p>Atur <code>ANDROID_POS_URL</code> ke alamat LAN komputer yang menjalankan POS, lalu sinkronkan dan buat ulang debug APK.</p>
      <p>Tablet dan komputer harus berada di jaringan Wi-Fi yang sama.</p>
    </main>
  </body>
</html>
